spring:
  datasource:
    url: jdbc:h2:mem:qaforgedev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    show-sql: true
    # Flyway's migrations (§11) are hand-written PostgreSQL DDL (gen_random_uuid() defaults,
    # TIMESTAMPTZ) for the real prod database. H2, even in MODE=PostgreSQL, does not accept
    # that DDL verbatim (verified by actually running Flyway against it) — for local/dev
    # convenience only, let Hibernate generate the H2 schema from the JPA entities instead.
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console

qaforge:
  mcp:
    playwright:
      enabled: false
  github:
    token: ${GITHUB_TOKEN:}

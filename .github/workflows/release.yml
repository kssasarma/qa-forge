name: Release

# Ship QA Forge whenever we want, two ways:
#   1. Push a tag matching v*.*.* (e.g. `git tag v1.4.0 && git push origin v1.4.0`).
#   2. Run this workflow manually from the Actions tab (workflow_dispatch) and pick a bump
#      type — no need to compute or push a tag by hand, the workflow does it.
#
# Either path: run the full test suite as a hard gate, build a version-stamped jar, build and
# smoke-test a container image, push it to GHCR, and publish a GitHub Release with the jar,
# its checksum, and an SBOM attached.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored when triggered by a tag push)
        type: choice
        options: [patch, minor, major, custom]
        default: patch
      custom_version:
        description: "Exact version for bump=custom, e.g. 1.4.0 or 2.0.0-rc.1 (no leading 'v')"
        type: string
        required: false
      draft:
        description: Create the GitHub Release as a draft instead of publishing it immediately
        type: boolean
        default: false
      platforms:
        description: Docker platforms to build and push
        type: string
        default: linux/amd64

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          CUSTOM_VERSION: ${{ inputs.custom_version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
          else
            LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
            LATEST_TAG="${LATEST_TAG:-v0.0.0}"
            BASE="${LATEST_TAG#v}"
            BASE="${BASE%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"

            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              custom)
                VERSION="$CUSTOM_VERSION"
                if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                  echo "::error::custom_version '$VERSION' is not a valid semantic version (expected X.Y.Z or X.Y.Z-label)"
                  exit 1
                fi
                ;;
              *)
                echo "::error::unknown bump type '$BUMP'"
                exit 1
                ;;
            esac

            TAG="v${VERSION}"
            if git rev-parse "$TAG" >/dev/null 2>&1; then
              echo "::error::Tag $TAG already exists — latest released tag is $LATEST_TAG. Re-run with a different bump/custom_version."
              exit 1
            fi

            git -c user.name="qa-forge-release-bot" -c user.email="actions@github.com" tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

          PRERELEASE=false
          [[ "$VERSION" == *-* ]] && PRERELEASE=true

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (prerelease=$PRERELEASE)" >> "$GITHUB_STEP_SUMMARY"

  # Full CI gate — same test suite as ordinary pushes/PRs (dashboard Vitest + Maven verify
  # against a real Postgres service). A release never ships on a build that hasn't passed this.
  test:
    needs: determine-version
    uses: ./.github/workflows/build.yml

  build-jar:
    needs: [determine-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: "21", distribution: "temurin", cache: maven }

      - uses: actions/setup-node@v4
        with: { node-version: "20.18.0", cache: "npm", cache-dependency-path: qa-forge-dashboard/package-lock.json }

      - name: Stamp release version into all modules
        run: mvn -B -q versions:set -DnewVersion="$VERSION" -DprocessAllModules=true -DgenerateBackupPoms=false

      - name: Build dashboard
        run: cd qa-forge-dashboard && npm ci && npm run build

      - name: Package jar
        # Dashboard static resources were already built by the step above, so skip the
        # -Pdashboard profile (it would just re-run the same npm build via exec-maven-plugin).
        # Tests already ran in the `test` job above on this exact commit, so just package.
        run: mvn -B -pl qa-forge-domain,qa-forge-application,qa-forge-infrastructure,qa-forge-bootstrap -am package -DskipTests

      - name: Checksum
        working-directory: qa-forge-bootstrap/target
        run: sha256sum qa-forge-bootstrap.jar > qa-forge-bootstrap.jar.sha256

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: qa-forge-bootstrap/target/qa-forge-bootstrap.jar
          format: cyclonedx-json
          output-file: qa-forge-bootstrap/target/qa-forge-bootstrap.cdx.json

      - name: Attest jar build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: qa-forge-bootstrap/target/qa-forge-bootstrap.jar

      # Flatten into dist/ (rather than uploading the qa-forge-bootstrap/target/* paths as-is)
      # so the publish-release job can download and reference these by simple filenames.
      - name: Stage release assets
        run: |
          mkdir -p dist
          cp qa-forge-bootstrap/target/qa-forge-bootstrap.jar dist/
          cp qa-forge-bootstrap/target/qa-forge-bootstrap.jar.sha256 dist/
          cp qa-forge-bootstrap/target/qa-forge-bootstrap.cdx.json dist/

      - uses: actions/upload-artifact@v4
        with:
          name: qa-forge-release-assets
          path: dist
          if-no-files-found: error

  build-and-push-image:
    needs: [determine-version, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/qa-forge
      VERSION: ${{ needs.determine-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest,enable=${{ needs.determine-version.outputs.prerelease == 'false' }}

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ env.VERSION }}
          platforms: linux/amd64
          load: true
          push: false
          tags: qa-forge:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name qa-forge-smoke -p 8080:8080 qa-forge:smoke-test
          ok=false
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"status":"UP"'; then
              echo "Container is healthy"
              ok=true
              break
            fi
            sleep 2
          done
          if [[ "$ok" != "true" ]]; then
            echo "::error::Container failed to reach a healthy state within 60s"
            docker logs qa-forge-smoke || true
            exit 1
          fi

      - name: Stop smoke test container
        if: always()
        run: docker rm -f qa-forge-smoke || true

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP_VERSION=${{ env.VERSION }}
          platforms: ${{ inputs.platforms || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish-release:
    needs: [determine-version, build-jar, build-and-push-image]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-forge-release-assets
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.determine-version.outputs.tag }}
          name: QA Forge ${{ needs.determine-version.outputs.tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ needs.determine-version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            Docker image: `ghcr.io/${{ github.repository_owner }}/qa-forge:${{ needs.determine-version.outputs.version }}`
          files: |
            dist/qa-forge-bootstrap.jar
            dist/qa-forge-bootstrap.jar.sha256
            dist/qa-forge-bootstrap.cdx.json

      - name: Summary
        run: |
          {
            echo "### Shipped ${{ needs.determine-version.outputs.tag }}"
            echo "- Jar: attached to the [GitHub Release](${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.determine-version.outputs.tag }})"
            echo "- Image: \`ghcr.io/${{ github.repository_owner }}/qa-forge:${{ needs.determine-version.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
